<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-select=no">
<title>أكمل الآية الكريمة</title>
<style>
  :root {
    --gold: #f59e0b;
    --gold-glow: rgba(245, 158, 11, 0.4);
    --emerald: #10b981;
    --bg-dark: #070d18;
  }
  * { margin:0; padding:0; box-sizing:border-box; font-family:system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color:transparent; }
  body {
    min-height: 100vh;
    background: radial-gradient(circle at 50% 10%, #064e3b 0%, var(--bg-dark) 100%);
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding-bottom: 24px;
    user-select: none;
    overflow-x: hidden;
  }
  .bar {
    position: sticky;
    top: 0;
    width: 100%;
    max-width: 520px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 16px;
    background: rgba(6, 78, 59, 0.85);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    z-index: 50;
  }
  .bar b { color: #fde68a; font-size: 1.05rem; display: flex; align-items: center; gap: 6px; }
  .badge {
    background: rgba(245, 158, 11, 0.15);
    color: #fbbf24;
    border: 1px solid rgba(245, 158, 11, 0.3);
    padding: 3px 10px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 0.85rem;
  }
  #exit {
    padding: 4px 14px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-weight: 700;
    cursor: pointer;
  }

  .container {
    width: 100%;
    max-width: 500px;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
  }

  /* Ayah Box */
  #ay-card {
    width: 100%;
    background: linear-gradient(135deg, rgba(6, 95, 70, 0.85), rgba(4, 47, 46, 0.95));
    border: 1.5px solid rgba(245, 158, 11, 0.3);
    border-radius: 22px;
    padding: 24px 18px;
    text-align: center;
    box-shadow: 0 12px 30px rgba(0, 0, 0, 0.4);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .surah-tag {
    font-size: 0.8rem;
    color: #34d399;
    font-weight: 800;
    background: rgba(0, 0, 0, 0.25);
    padding: 3px 14px;
    border-radius: 999px;
  }
  .ayah-text {
    font-size: 1.5rem;
    font-weight: 800;
    color: #fef08a;
    line-height: 2;
  }

  /* Options list */
  #ops {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .big {
    border: 1px solid rgba(255, 255, 255, 0.15);
    border-radius: 16px;
    padding: 16px;
    background: rgba(255, 255, 255, 0.08);
    color: #fff;
    font-weight: 800;
    font-size: 1.15rem;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 0 4px 14px rgba(0,0,0,0.2);
    text-align: center;
  }
  .big:hover:not(:disabled) {
    transform: translateY(-2px);
    background: rgba(245, 158, 11, 0.18);
    border-color: var(--gold);
  }
  .big:active:not(:disabled) { transform: scale(0.97); }

  .big.correct {
    background: linear-gradient(135deg, #059669, #10b981) !important;
    border-color: #34d399 !important;
    box-shadow: 0 0 25px rgba(16, 185, 129, 0.5) !important;
  }
  .big.wrong {
    background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
    border-color: #f87171 !important;
    animation: shake 0.4s ease;
  }

  /* Al-Mu'een Companion */
  .mueen-card {
    width: 100%;
    background: rgba(20, 184, 166, 0.15);
    border: 1px solid rgba(45, 212, 191, 0.35);
    border-radius: 16px;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }
  .mueen-avatar {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2dd4bf, #0d9488);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.2rem;
  }
  .mueen-body b { display: block; font-size: 0.85rem; color: #5eead4; }
  .mueen-body span { font-size: 0.75rem; color: #ccfbf1; }

  /* Canvas */
  #c-canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100vw; height: 100vh;
    pointer-events: none;
    z-index: 100;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20%, 60% { transform: translateX(-6px); }
    40%, 80% { transform: translateX(6px); }
  }
</style>
</head>
<body>

<canvas id="c-canvas"></canvas>

<div class="bar">
  <b><span>📖</span><span>أكمل الآية الكريمة</span></b>
  <div style="display:flex; align-items:center; gap:8px;">
    <div class="badge" id="hud-level">المستوى 1</div>
    <div class="badge" id="stars">⭐ 0</div>
    <button id="exit">خروج ✕</button>
  </div>
</div>

<div class="container">
  <div id="ay-card">
    <div class="surah-tag" id="surah-tag">سورة الرعد</div>
    <div class="ayah-text" id="ay">﴿ أَلَا بِذِكْرِ اللَّهِ ... ﴾</div>
  </div>

  <div id="ops"></div>

  <div class="mueen-card" id="mueen-card">
    <div class="mueen-avatar">💡</div>
    <div class="mueen-body">
      <b>المُعِين القرآني الذكي</b>
      <span id="mueen-hint">اضغط هنا للحصول على تلميح الآية الكريمة!</span>
    </div>
  </div>
</div>

<script>
// Web Audio Synthesizer
const AC = window.AudioContext || window.webkitAudioContext;
let aCtx = null;
function getAudio() {
  if (!aCtx) aCtx = new AC();
  if (aCtx.state === 'suspended') aCtx.resume();
  return aCtx;
}
function playTone(freq, type, dur) {
  try {
    const ctx = getAudio();
    const osc = ctx.createOscillator();
    const g = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    g.gain.setValueAtTime(0.2, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
    osc.connect(g);
    g.connect(ctx.destination);
    osc.start();
    osc.stop(ctx.currentTime + dur);
  } catch(e) {}
}
function playSuccess() {
  [523, 659, 783, 1046].forEach((f, i) => setTimeout(() => playTone(f, 'triangle', 0.25), i * 75));
}
function playWrong() { playTone(200, 'sawtooth', 0.2); }

// Confetti
const canvas = document.getElementById('c-canvas');
const ctx = canvas.getContext('2d');
let parts = [];
function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
window.addEventListener('resize', resize);
resize();
function popConfetti() {
  for (let i = 0; i < 35; i++) {
    parts.push({
      x: window.innerWidth/2, y: window.innerHeight/2,
      vx: (Math.random()-0.5)*12, vy: (Math.random()-0.7)*14,
      size: Math.random()*7 + 3,
      color: ['#f59e0b','#10b981','#38bdf8','#f43f5e'][Math.floor(Math.random()*4)],
      alpha: 1
    });
  }
}
function animConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  parts = parts.filter(p => p.alpha > 0.02);
  parts.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.vy += 0.35; p.alpha *= 0.95;
    ctx.fillStyle = p.color; ctx.globalAlpha = p.alpha;
    ctx.fillRect(p.x, p.y, p.size, p.size);
  });
  requestAnimationFrame(animConfetti);
}
requestAnimationFrame(animConfetti);

// 30+ Quranic Ayahs with Surah context and hints
const P = [
  { p: "أَلَا بِذِكْرِ اللَّهِ", c: "تَطْمَئِنُّ الْقُلُوبُ", surah: "سورة الرعد", hint: "ذكر الله يجلب الطمأنينة والسكينة للقلب" },
  { p: "وَاعْتَصِمُوا بِحَبْلِ اللَّهِ", c: "جَمِيعًا وَلَا تَفَرَّقُوا", surah: "سورة آل عمران", hint: "دعوة قرآنية للوحدة والأخوة وعدم التفرق" },
  { p: "إِنَّ اللَّهَ مَعَ", c: "الصَّابِرِينَ", surah: "سورة البقرة", hint: "بشارة عظيمة لمن يصبر على الطاعة" },
  { p: "وَقُل رَّبِّ زِدْنِي", c: "عِلْمًا", surah: "سورة طه", hint: "الدعاء المبارك لطلب العلم والتفوق" },
  { p: "إِنَّمَا الْمُؤْمِنُونَ", c: "إِخْوَةٌ", surah: "سورة الحجرات", hint: "المؤمنون في كل مكان أسرة واحدة وإخوة" },
  { p: "وَتَعَاوَنُوا عَلَى", c: "الْبِرِّ وَالتَّقْوَى", surah: "سورة المائدة", hint: "التعاون على كل عمل صالح ومفيد" },
  { p: "رَبَّنَا آتِنَا فِي الدُّنْيَا", c: "حَسَنَةً", surah: "سورة البقرة", hint: "دعاء جامع لخير الدنيا والآخرة" },
  { p: "إِنَّا أَعْطَيْنَاكَ", c: "الْكَوْثَرَ", surah: "سورة الكوثر", hint: "نهر عظيم في الجنة أُعطي لنبينا محمد ﷺ" },
  { p: "فَإِنَّ مَعَ الْعُسْرِ", c: "يُسْرًا", surah: "سورة الشرح", hint: "بعد كل ضيق وصعوبة فرج قريب" },
  { p: "اللَّهُ نُورُ", c: "السَّمَاوَاتِ وَالْأَرْضِ", surah: "سورة النور", hint: "آية النور العظيمة" },
  { p: "وَقُولُوا لِلنَّاسِ", c: "حُسْنًا", surah: "سورة البقرة", hint: "الكلمة الطيبة وحسن الخلق مع الجميع" },
  { p: "وَبِالْوَالِدَيْنِ", c: "إِحْسَانًا", surah: "سورة الإسراء", hint: "أعظم بر بعد حق الله هو بر الوالدين" },
  { p: "إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ", c: "الْمُحْسِنِينَ", surah: "سورة الأعراف", hint: "الذين يعبدون الله كأنهم يرونه ويحسنون إلى الناس" },
  { p: "وَأَحْسِنُوا إِنَّ اللَّهَ يُحِبُّ", c: "الْمُحْسِنِينَ", surah: "سورة البقرة", hint: "الله يحب من يتقن عمله ويحسن للآخرين" }
];

let s = 0, lv = 1, answered = false;
const ayCard = document.getElementById('ay');
const surahTag = document.getElementById('surah-tag');
const ops = document.getElementById('ops');
const starsEl = document.getElementById('stars');
const hudLevel = document.getElementById('hud-level');
const mueenHint = document.getElementById('mueen-hint');
const mueenCard = document.getElementById('mueen-card');

function round() {
  answered = false;
  const item = P[Math.floor(Math.random() * P.length)];
  ayCard.textContent = `﴿ ${item.p} ... ﴾`;
  surahTag.textContent = item.surah;
  mueenHint.textContent = `تلميح المُعِين: ${item.hint}`;

  // Distractors
  const set = [item.c];
  let guard = 0;
  while (set.length < 3 && guard++ < 50) {
    const w = P[Math.floor(Math.random() * P.length)].c;
    if (!set.includes(w)) set.push(w);
  }
  set.sort(() => Math.random() - 0.5);

  ops.innerHTML = '';
  set.forEach(v => {
    const b = document.createElement('button');
    b.className = 'big';
    b.textContent = v;
    b.addEventListener('click', () => {
      if (answered) return;
      answered = true;

      if (v === item.c) {
        b.classList.add('correct');
        playSuccess();
        popConfetti();
        s += 2;
        if (s >= lv * 8) {
          lv++;
          hudLevel.textContent = `المستوى ${lv}`;
        }
        starsEl.textContent = `⭐ ${s}`;
        mueenHint.textContent = `أحسنت يا بطل! إجابة صحيحة ومباركة 🌟`;

        try { parent.postMessage({ type: 'nour:game:stars', amount: 2 }, '*'); } catch(x) {}
        setTimeout(round, 1100);
      } else {
        b.classList.add('wrong');
        playWrong();
        mueenHint.textContent = `التكملة الصحيحة هي: (${item.c})`;
        setTimeout(round, 1400);
      }
    });
    ops.appendChild(b);
  });
}

mueenCard.addEventListener('click', () => {
  mueenCard.style.borderColor = '#f59e0b';
  setTimeout(() => { mueenCard.style.borderColor = 'rgba(45, 212, 191, 0.35)'; }, 1000);
});

document.getElementById('exit').addEventListener('click', () => {
  try { parent.postMessage({ type: 'nour:game:exit' }, '*'); } catch(x) {}
});

try { parent.postMessage({ type: 'nour:game:ready' }, '*'); } catch(x) {}
window.addEventListener('message', (ev) => {
  const d = ev.data || {};
  if (d.type === 'nour:game:profile' && d.name) {
    surahTag.textContent = `بطل القرآن: ${d.name}`;
  }
});

round();
</script>
</body>
</html>
