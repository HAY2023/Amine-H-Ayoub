<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{margin:0;box-sizing:border-box;font-family:system-ui}
body{min-height:100vh;background:linear-gradient(160deg,#0b1220,#134e4a);color:#fff;display:flex;flex-direction:column;align-items:center;user-select:none;-webkit-user-select:none;overflow:hidden}
.bar{position:fixed;top:0;left:0;right:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,.35);backdrop-filter:blur(8px);z-index:9}
.bar b{color:#fbbf24;font-size:1.05rem}
#exit{padding:6px 14px;border:1px solid rgba(255,255,255,.25);border-radius:999px;background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer}
#star{position:fixed;font-size:3.6rem;cursor:pointer;filter:drop-shadow(0 0 14px rgba(251,191,36,.8));transition:transform .12s;z-index:2}
#star:active{transform:scale(.8)}
#hint{position:fixed;bottom:24px;left:0;right:0;text-align:center;color:#5eead4;font-size:.85rem}
</style>
</head>
<body>
<div class="bar"><b>🌟 اصطد النجمة</b><span id="stars">⭐ 0</span><button id="exit">خروج ✕</button></div>
<div id="star">⭐</div>
<div id="hint">اضغط على النجمة كلما ظهرت في مكان جديد</div>
<script>
var s=0,el=document.getElementById('star');
function move(){el.style.left=(12+Math.random()*74)+'vw';el.style.top=(14+Math.random()*62)+'vh'}
el.addEventListener('click',function(){s++;document.getElementById('stars').textContent='⭐ '+s;try{parent.postMessage({type:'nour:game:stars',amount:1},'*')}catch(e){}move()});
document.getElementById('exit').addEventListener('click',function(){try{parent.postMessage({type:'nour:game:exit'},'*')}catch(e){}});
try{parent.postMessage({type:'nour:game:ready'},'*')}catch(e){}
window.addEventListener('message',function(ev){var d=ev.data||{};if(d.type==='nour:game:profile'&&d.name)document.getElementById('hint').textContent='بطلنا '+d.name+' — اضغط على النجمة!'});
move();
</script>
</body>
</html>
