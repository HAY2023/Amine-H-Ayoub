name: Generate Android Keystore (مرة واحدة فقط)

# يُشغَّل يدوياً فقط من تبويب Actions
on:
  workflow_dispatch:

jobs:
  generate-keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore android-release.keystore \
            -alias quran_alias \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass qurankids2026 \
            -keypass qurankids2026 \
            -dname "CN=Amine, OU=Dev, O=QuranKids, L=Algiers, ST=Algiers, C=DZ"

      - name: Base64 encode keystore
        run: |
          base64 -w 0 android-release.keystore > keystore_base64.txt
          echo ""
          echo "╔═══════════════════════════════════════════════════╗"
          echo "║  ⚠️  احفظ هذا الملف في مكان آمن جداً!           ║"
          echo "║  فقدانه = عدم القدرة على تحديث التطبيق مستقبلاً  ║"
          echo "╚═══════════════════════════════════════════════════╝"

      - name: Upload keystore files
        uses: actions/upload-artifact@v4
        with:
          name: android-keystore-SECRET
          retention-days: 1
          path: |
            android-release.keystore
            keystore_base64.txt
