[package]
name = "hajj_ayoub_amine"
version = "1.0.1"
description = "تطبيق تعليم القرآن الكريم برواية ورش - القارئ حاج أيوب أمين"
authors = ["Hajj Ayoub Amine <contact@hay2023.org>"]
license = "MIT"
repository = "https://github.com/HAY2023/Amine-H-Ayoub"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.2", features = [] }
tauri-plugin-log = "2"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
futures-util = "0.3"
