<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المرتل برواية ورش | القارئ الشيخ حاج أيوب أمين</title>
    <meta name="description" content="الموقع الرسمي الموحد لتحميل تطبيق حاج أيوب أمين للقرآن الكريم برواية ورش: ويندوز، أندرويد، وشاشات التلفاز الذكية.">
    <meta name="google-site-verification" content="grroxjCHbNJugXyRMu0iDMvrqGiE0CT3yxanJPlZTg8" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900;1000&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-emerald: #059669;
            --emerald-glow: #10b981;
            --gold-light: #fef08a;
            --gold: #f59e0b;
            --gold-deep: #d97706;
            --gold-gradient: linear-gradient(135deg, #fffbeb 0%, #fef08a 25%, #f59e0b 60%, #b45309 100%);
            --dark-bg: #030712;
            --card-border: rgba(245, 158, 11, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(2, 44, 34, 0.75) 0px, transparent 65%),
                radial-gradient(circle at 15% 15%, rgba(5, 150, 105, 0.25) 0px, transparent 50%),
                radial-gradient(circle at 85% 85%, rgba(217, 119, 6, 0.25) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.85;
        }

        .bg-grid-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(245, 158, 11, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.04) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* ═══════════════════════════════════════════════════════════
           🌟 3-NODE REVOLVING CELESTIAL ORBIT HUB 🌟
        ═══════════════════════════════════════════════════════════ */
        .orbit-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .orbit-container {
            position: relative;
            width: 600px;
            height: 600px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Static & Glowing Celestial Background Orbit Rings */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .orbit-ring-outer {
            width: 560px;
            height: 560px;
            border: 1.5px dashed rgba(245, 158, 11, 0.35);
            animation: rotateClockwise 65s linear infinite;
        }

        .orbit-ring-middle {
            width: 420px;
            height: 420px;
            border: 1.5px solid rgba(16, 185, 129, 0.4);
            box-shadow: inset 0 0 40px rgba(16, 185, 129, 0.18), 0 0 30px rgba(16, 185, 129, 0.15);
            animation: rotateCounter 45s linear infinite;
        }

        .orbit-ring-inner {
            width: 260px;
            height: 260px;
            border: 2px solid rgba(245, 158, 11, 0.55);
            box-shadow: 0 0 50px rgba(245, 158, 11, 0.35);
        }

        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateCounter {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* ── Revolving Layer for the 3 Orbiting Platforms (تدور بسلاسة) ── */
        .orbit-revolving-track {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            animation: orbitSpin 32s linear infinite;
            pointer-events: auto;
        }
        .orbit-container:hover .orbit-revolving-track {
            animation-play-state: paused;
        }

        @keyframes orbitSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* ── Central Sheikh Core ── */
        .orbit-center-core {
            position: absolute;
            width: 215px;
            height: 215px;
            border-radius: 50%;
            background: #030712;
            border: 4.5px solid var(--gold);
            box-shadow: 
                0 0 0 10px rgba(245, 158, 11, 0.3),
                0 0 65px rgba(245, 158, 11, 0.85),
                0 0 90px rgba(16, 185, 129, 0.45);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orbit-center-core img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform 0.5s ease;
        }

        .orbit-center-core:hover img {
            transform: scale(1.09);
        }

        .orbit-center-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.25) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 1.1rem;
            z-index: 2;
        }

        .orbit-center-title {
            font-family: 'Cairo', sans-serif;
            font-size: 1.2rem;
            font-weight: 1000;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.3px;
        }

        .orbit-center-status {
            font-size: 0.82rem;
            color: #34d399;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 3px;
        }

        /* ── 3 Orbiting Node Cards (Triangle 120 deg on 420px Ring, Radius = 210px) ── */
        .orbit-node-anchor {
            position: absolute;
            width: 100px;
            height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
        }

        /* Triangular Positions (Radius = 210px on 600px width) */
        /* Node 1: Top (Windows PC) */
        .pos-node-1 {
            top: 45px;
            left: 250px;
        }
        /* Node 2: Bottom-Right (Android APK) - 120 deg */
        .pos-node-2 {
            top: 360px;
            right: 75px;
        }
        /* Node 3: Bottom-Left (Smart TV) - 240 deg */
        .pos-node-3 {
            top: 360px;
            left: 75px;
        }

        .orbit-node-card {
            width: 96px;
            height: 96px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.96);
            border: 2.5px solid var(--card-border);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            user-select: none;
            /* Counter-rotate to stay upright during orbit */
            animation: counterSpin 32s linear infinite;
        }
        .orbit-container:hover .orbit-node-card {
            animation-play-state: paused;
        }

        @keyframes counterSpin {
            from { transform: rotate(0deg); }
            to { transform: rotate(-360deg); }
        }

        .orbit-node-anchor:hover .orbit-node-card {
            transform: scale(1.22);
            border-color: var(--gold);
            background: rgba(30, 41, 59, 0.98);
            box-shadow: 0 0 45px rgba(245, 158, 11, 0.95);
        }

        .orbit-node-logo {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 42px;
        }

        .orbit-node-label {
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-top: 4px;
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }

        /* ── Top Official Version Badge ── */
        .orbit-top-badge {
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            gap: 0.65rem;
            background: linear-gradient(135deg, rgba(245, 158, 11, 0.16) 0%, rgba(15, 23, 42, 0.85) 100%);
            border: 1.5px solid rgba(245, 158, 11, 0.55);
            border-radius: 50px;
            padding: 0.55rem 1.6rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.25);
            backdrop-filter: blur(20px);
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--gold-light);
            animation: fadeIn 0.8s ease-out;
            font-family: 'Cairo', sans-serif;
            text-align: center;
        }

        .badge-gold-crown {
            font-size: 1.15rem;
        }

        .badge-text-main strong {
            color: #fff;
            background: var(--gold-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 1000;
            padding: 0 2px;
        }

        /* ── Floating Mini Recitation Bar ── */
        .orbit-bottom-bar {
            margin-top: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.88);
            border: 1.5px solid rgba(245, 158, 11, 0.35);
            border-radius: 50px;
            padding: 0.65rem 1.75rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            animation: fadeIn 0.8s ease-out;
        }

        .orbit-bottom-bar span {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--gold-light);
        }

        .btn-play-mini {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--primary-emerald);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-play-mini:hover {
            background: var(--emerald-glow);
            transform: scale(1.12);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ── Responsive on Mobile & Tablets ── */
        @media (max-width: 680px) {
            .orbit-top-badge {
                font-size: 0.78rem;
                padding: 0.45rem 1.1rem;
                margin-bottom: 1rem;
            }
            .orbit-container {
                width: 350px;
                height: 350px;
            }
            .orbit-ring-outer { width: 340px; height: 340px; }
            .orbit-ring-middle { width: 250px; height: 250px; }
            .orbit-ring-inner { width: 160px; height: 160px; }
            .orbit-center-core { width: 135px; height: 135px; }
            .orbit-center-title { font-size: 0.88rem; }
            .orbit-center-status { font-size: 0.65rem; }

            .orbit-node-anchor { width: 68px; height: 68px; }
            .orbit-node-card { width: 68px; height: 68px; }
            .orbit-node-logo svg { width: 28px; height: 28px; }
            .orbit-node-label { font-size: 0.58rem; }

            /* Mobile Triangular Positions (Radius = 125px on 350px width) */
            .pos-node-1 { top: 20px; left: 141px; }
            .pos-node-2 { top: 215px; right: 35px; }
            .pos-node-3 { top: 215px; left: 35px; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="bg-grid-pattern"></div>

    <main class="orbit-wrapper">
        <!-- 👑 Top Official Version Badge 👑 -->
        <div class="orbit-top-badge">
            <span class="badge-gold-crown">👑</span>
            <span class="badge-text-main">الإصدار الموحد الرسمي <strong id="top-badge-version">v1.0.0</strong> — برواية ورش عن نافع</span>
        </div>

        <!-- 🌟 THE 3-NODE REVOLVING CELESTIAL ORBIT HUB 🌟 -->
        <div class="orbit-container">
            <!-- Glowing Orbit Rings -->
            <div class="orbit-ring orbit-ring-outer"></div>
            <div class="orbit-ring orbit-ring-middle"></div>
            <div class="orbit-ring orbit-ring-inner"></div>

            <!-- Central Core: Sheikh Hajj Ayoub Amine -->
            <a href="https://huggingface.co/datasets/hammoualiyoucef20/quran-app-releases/resolve/main/Quran_1.0.0_x64-setup.exe" id="orbit-center-btn" class="orbit-center-core" title="المصحف المرتل - الشيخ حاج أيوب أمين">
                <img src="assets/my-photo.png" alt="القارئ الشيخ حاج أيوب أمين">
                <div class="orbit-center-overlay">
                    <span class="orbit-center-title">حاج أيوب أمين</span>
                    <span class="orbit-center-status">● كل النسخ متاحة</span>
                </div>
            </a>

            <!-- 🌀 Revolving 3-Node Platform Layer (تدور حول المركز) 🌀 -->
            <div class="orbit-revolving-track">
                <!-- 1. Windows PC (Official Windows Modern Logo) -->
                <a id="node-windows" href="https://huggingface.co/datasets/hammoualiyoucef20/quran-app-releases/resolve/main/Quran_1.0.0_x64-setup.exe" class="orbit-node-anchor pos-node-1" title="تحميل برنامج ويندوز للكمبيوتر EXE">
                    <div class="orbit-node-card">
                        <div class="orbit-node-logo">
                            <!-- Official Windows 11 Vector Logo -->
                            <svg width="34" height="34" viewBox="0 0 88 88" fill="none">
                                <path d="M0 12.48L35.65 7.62V41.74H0V12.48ZM35.65 46.26V80.38L0 75.52V46.26H35.65ZM40.09 7.02L87.83 0.38V41.74H40.09V7.02ZM87.83 46.26V87.62L40.09 80.98V46.26H87.83Z" fill="#00A4EF"/>
                            </svg>
                        </div>
                        <span class="orbit-node-label">Windows PC</span>
                    </div>
                </a>

                <!-- 2. Android Phone (Official Android Green Robot Logo) -->
                <a id="node-android" href="https://huggingface.co/datasets/hammoualiyoucef20/quran-app-releases/resolve/main/Quran_1.0.0_Android.apk" class="orbit-node-anchor pos-node-2" title="تحميل تطبيق أندرويد للهواتف APK">
                    <div class="orbit-node-card">
                        <div class="orbit-node-logo">
                            <!-- Official Android Vector Logo -->
                            <svg width="34" height="34" viewBox="0 0 24 24" fill="#3DDC84">
                                <path d="M6 18c0 .55.45 1 1 1h1v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h2v3.5c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5V19h1c.55 0 1-.45 1-1V8H6v10zM3.5 8C2.67 8 2 8.67 2 9.5v6c0 .83.67 1.5 1.5 1.5S5 16.33 5 15.5v-6C5 8.67 4.33 8 3.5 8zm17 0c-.83 0-1.5.67-1.5 1.5v6c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-6c0-.83-.67-1.5-1.5-1.5zm-4.97-5.84l1.3-1.3c.2-.2.2-.51 0-.71-.2-.2-.51-.2-.71 0l-1.48 1.48C13.85 1.23 12.95 1 12 1c-.96 0-1.86.23-2.66.63L7.85.15c-.2-.2-.51-.2-.71 0-.2.2-.2.51 0 .71l1.31 1.31C6.97 3.26 6 5.01 6 7h12c0-1.99-.97-3.75-2.47-4.84zM9 5H8V4h1v1zm7 0h-1V4h1v1z"/>
                            </svg>
                        </div>
                        <span class="orbit-node-label">Android APK</span>
                    </div>
                </a>

                <!-- 3. Google TV (Official Google TV 4K Logo) -->
                <a id="node-tv" href="https://huggingface.co/datasets/hammoualiyoucef20/quran-app-releases/resolve/main/Quran_1.0.0_Android_TV.apk" class="orbit-node-anchor pos-node-3" title="تحميل تطبيق التلفاز الذكي Google TV & Android TV APK">
                    <div class="orbit-node-card">
                        <div class="orbit-node-logo">
                            <!-- Sleek Modern Google TV 4K Vector Logo -->
                            <svg width="38" height="38" viewBox="0 0 48 48" fill="none">
                                <rect x="3" y="6" width="42" height="27" rx="5" fill="#0f172a" stroke="#64748b" stroke-width="2.5"/>
                                <path d="M17 40h14M24 33v7" stroke="#64748b" stroke-width="3" stroke-linecap="round"/>
                                <!-- Google 4-Color TV Display -->
                                <circle cx="17" cy="19.5" r="4.5" fill="#4285F4"/>
                                <circle cx="31" cy="19.5" r="4.5" fill="#EA4335"/>
                                <circle cx="24" cy="13.5" r="4.5" fill="#FBBC05"/>
                                <circle cx="24" cy="25.5" r="4.5" fill="#34A853"/>
                            </svg>
                        </div>
                        <span class="orbit-node-label">Google TV</span>
                    </div>
                </a>
            </div>
        </div>

        <!-- Mini Audio Recitation Bar -->
        <div class="orbit-bottom-bar">
            <button id="btn-audio-toggle" class="btn-play-mini" title="استمع لتلاوة سورة الفاتحة">▶</button>
            <span id="audio-label-text">سورة الفاتحة • بصوت القارئ الشيخ حاج أيوب أمين (برواية ورش)</span>
            <audio id="preview-audio-elem" preload="auto">
                <source src="https://huggingface.co/datasets/hammoualiyoucef20/quran-audio/resolve/main/1.mp3" type="audio/mpeg">
            </audio>
        </div>
    </main>

    <!-- Main Logic Script -->
    <script src="script.js"></script>
</body>
</html>
