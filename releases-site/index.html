<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المصحف المرتل برواية ورش | القارئ الشيخ حاج أيوب أمين</title>
    <meta name="description" content="الموقع الرسمي الموحد لتحميل تطبيق حاج أيوب أمين للقرآن الكريم برواية ورش لكافة المنصات: ويندوز، أندرويد، آيفون، وشاشات التلفاز الذكية.">
    
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="assets/app-icon.png">
    <link rel="apple-touch-icon" href="assets/app-icon.png">
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900;1000&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary-emerald: #059669;
            --emerald-glow: #10b981;
            --gold-light: #fef08a;
            --gold: #f59e0b;
            --gold-gradient: linear-gradient(135deg, #fffbeb 0%, #fef08a 25%, #f59e0b 60%, #b45309 100%);
            --dark-bg: #030712;
            --card-border: rgba(245, 158, 11, 0.35);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            background-color: var(--dark-bg);
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(2, 44, 34, 0.65) 0px, transparent 65%),
                radial-gradient(circle at 20% 20%, rgba(5, 150, 105, 0.22) 0px, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(217, 119, 6, 0.22) 0px, transparent 50%);
            color: #f8fafc;
            min-height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        #particles-canvas {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            opacity: 0.85;
        }

        .bg-grid-pattern {
            position: fixed;
            inset: 0;
            background-image: 
                linear-gradient(to right, rgba(245, 158, 11, 0.035) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(16, 185, 129, 0.035) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* ═══════════════════════════════════════════════════════════
           CELESTIAL RADIAL ORBIT HUB (FULLSCREEN MASTERPIECE)
        ═══════════════════════════════════════════════════════════ */
        .orbit-wrapper {
            position: relative;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }

        .orbit-container {
            position: relative;
            width: 620px;
            height: 620px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Celestial Orbit Rings */
        .orbit-ring {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
        }

        .orbit-ring-outer {
            width: 580px;
            height: 580px;
            border: 1.5px dashed rgba(245, 158, 11, 0.35);
            animation: rotateClockwise 75s linear infinite;
        }

        .orbit-ring-middle {
            width: 410px;
            height: 410px;
            border: 1.5px solid rgba(16, 185, 129, 0.35);
            box-shadow: inset 0 0 35px rgba(16, 185, 129, 0.15);
            animation: rotateCounter 55s linear infinite;
        }

        .orbit-ring-inner {
            width: 250px;
            height: 250px;
            border: 2px solid rgba(245, 158, 11, 0.45);
            box-shadow: 0 0 45px rgba(245, 158, 11, 0.3);
        }

        @keyframes rotateClockwise {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes rotateCounter {
            from { transform: rotate(360deg); }
            to { transform: rotate(0deg); }
        }

        /* Central Sheikh Core */
        .orbit-center-core {
            position: absolute;
            width: 210px;
            height: 210px;
            border-radius: 50%;
            background: #030712;
            border: 4px solid var(--gold);
            box-shadow: 
                0 0 0 9px rgba(245, 158, 11, 0.28),
                0 0 60px rgba(245, 158, 11, 0.75),
                0 0 80px rgba(16, 185, 129, 0.4);
            z-index: 20;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            text-decoration: none;
            color: inherit;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .orbit-center-core img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center top;
            transition: transform 0.5s ease;
        }

        .orbit-center-core:hover img {
            transform: scale(1.08);
        }

        .orbit-center-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(3, 7, 18, 0.95) 0%, rgba(3, 7, 18, 0.25) 60%, transparent 100%);
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: center;
            padding-bottom: 1.1rem;
            z-index: 2;
        }

        .orbit-center-title {
            font-family: 'Cairo', sans-serif;
            font-size: 1.15rem;
            font-weight: 1000;
            color: #fff;
            text-align: center;
            line-height: 1.2;
            letter-spacing: -0.3px;
        }

        .orbit-center-status {
            font-size: 0.8rem;
            color: #34d399;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 5px;
            margin-top: 2px;
        }

        /* 4 Orbiting Platform Nodes */
        .orbit-node {
            position: absolute;
            width: 92px;
            height: 92px;
            border-radius: 50%;
            background: rgba(15, 23, 42, 0.96);
            border: 2.5px solid var(--card-border);
            backdrop-filter: blur(20px);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #fff;
            text-decoration: none;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.85);
            transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 25;
            cursor: pointer;
            user-select: none;
        }

        .orbit-node:hover, .orbit-node.active-node {
            transform: scale(1.22);
            border-color: var(--gold);
            background: rgba(30, 41, 59, 0.98);
            box-shadow: 0 0 45px rgba(245, 158, 11, 0.95);
            z-index: 30;
        }

        .orbit-node-icon {
            font-size: 2.3rem;
            line-height: 1;
        }

        .orbit-node-label {
            font-size: 0.72rem;
            font-weight: 900;
            color: var(--gold-light);
            margin-top: 4px;
            white-space: nowrap;
            font-family: 'Cairo', sans-serif;
        }

        /* Exact 4-Platform Radial Positions (Radius = 245px on 620px circle) */
        .node-pos-top    { top: 18px; left: 264px; }                /* Top: iPhone & iPad */
        .node-pos-right  { top: 264px; right: 18px; }               /* Right: Android APK */
        .node-pos-bottom { bottom: 18px; left: 264px; }             /* Bottom: Windows PC */
        .node-pos-left   { top: 264px; left: 18px; }                /* Left: Smart TV */

        /* Floating Mini Audio Bar Below Orbit */
        .orbit-bottom-bar {
            margin-top: 1.8rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            background: rgba(15, 23, 42, 0.85);
            border: 1.5px solid rgba(245, 158, 11, 0.3);
            border-radius: 50px;
            padding: 0.6rem 1.6rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            animation: fadeIn 0.8s ease-out;
        }

        .orbit-bottom-bar span {
            font-size: 0.92rem;
            font-weight: 800;
            color: var(--gold-light);
        }

        .btn-play-mini {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--primary-emerald);
            border: none;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-play-mini:hover {
            background: var(--emerald-glow);
            transform: scale(1.1);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 680px) {
            .orbit-container {
                width: 350px;
                height: 350px;
            }
            .orbit-ring-outer { width: 340px; height: 340px; }
            .orbit-ring-middle { width: 245px; height: 245px; }
            .orbit-ring-inner { width: 155px; height: 155px; }
            .orbit-center-core { width: 135px; height: 135px; }
            .orbit-center-title { font-size: 0.85rem; }
            .orbit-center-status { font-size: 0.65rem; }
            .orbit-node { width: 62px; height: 62px; }
            .orbit-node-icon { font-size: 1.55rem; }
            .orbit-node-label { font-size: 0.58rem; }
            
            /* Positions on 350px circle (Radius = 144px) */
            .node-pos-top    { top: 8px; left: 144px; }
            .node-pos-right  { top: 144px; right: 8px; }
            .node-pos-bottom { bottom: 8px; left: 144px; }
            .node-pos-left   { top: 144px; left: 8px; }
        }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>
    <div class="bg-grid-pattern"></div>

    <main class="orbit-wrapper">
        <!-- 🌟 THE CELESTIAL RADIAL ORBIT HUB 🌟 -->
        <div class="orbit-container">
            <!-- Glowing Orbit Rings -->
            <div class="orbit-ring orbit-ring-outer"></div>
            <div class="orbit-ring orbit-ring-middle"></div>
            <div class="orbit-ring orbit-ring-inner"></div>

            <!-- Central Core: Sheikh Hajj Ayoub Amine -->
            <a href="https://github.com/HAY2023/Amine-H-Ayoub/releases/latest" id="orbit-center-btn" class="orbit-center-core" title="المصحف المرتل - الشيخ حاج أيوب أمين">
                <img src="assets/my-photo.png" alt="القارئ الشيخ حاج أيوب أمين">
                <div class="orbit-center-overlay">
                    <span class="orbit-center-title">حاج أيوب أمين</span>
                    <span class="orbit-center-status">● كل النسخ متاحة</span>
                </div>
            </a>

            <!-- 1. Top: iPhone & iPad -->
            <a id="node-ios" href="https://learn-quran-kids.pages.dev" class="orbit-node node-pos-top" title="تشغيل تطبيق iPhone و iPad">
                <span class="orbit-node-icon">🍏</span>
                <span class="orbit-node-label">iPhone & iPad</span>
            </a>

            <!-- 2. Right: Android APK -->
            <a id="node-android" href="https://github.com/HAY2023/Amine-H-Ayoub/releases/latest" class="orbit-node node-pos-right" title="تحميل تطبيق أندرويد للهواتف APK">
                <span class="orbit-node-icon">📱</span>
                <span class="orbit-node-label">Android APK</span>
            </a>

            <!-- 3. Bottom: Windows PC -->
            <a id="node-windows" href="https://github.com/HAY2023/Amine-H-Ayoub/releases/latest" class="orbit-node node-pos-bottom" title="تحميل برنامج ويندوز للكمبيوتر EXE">
                <span class="orbit-node-icon">💻</span>
                <span class="orbit-node-label">Windows PC</span>
            </a>

            <!-- 4. Left: Smart TV -->
            <a id="node-tv" href="https://github.com/HAY2023/Amine-H-Ayoub/releases/latest" class="orbit-node node-pos-left" title="تحميل تطبيق التلفاز الذكي Android TV APK">
                <span class="orbit-node-icon">📺</span>
                <span class="orbit-node-label">Smart TV</span>
            </a>
        </div>

        <!-- Mini Audio Recitation Bar -->
        <div class="orbit-bottom-bar">
            <button id="btn-audio-toggle" class="btn-play-mini" title="استمع لتلاوة سورة الفاتحة">▶</button>
            <span>سورة الفاتحة • برواية ورش عن نافع</span>
            <audio id="preview-audio-elem" preload="none">
                <source src="https://huggingface.co/datasets/HAY2023/quran-kids-audio/resolve/main/audio/1.mp3" type="audio/mpeg">
            </audio>
        </div>
    </main>

    <!-- Main Logic Script -->
    <script src="script.js"></script>
</body>
</html>
