name: Build 3 Core Platforms (Windows + Android Mobile + Android TV)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────── 1. تطبيق ويندوز (EXE + MSI) ─────────────
  windows:
    name: 💻 Build Windows (EXE & MSI)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Generate app icon
        run: npx --yes @tauri-apps/cli@^2 icon src-tauri/icons/app-icon.png

      - name: Build Windows desktop app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "حاج أيوب أمين ${{ github.ref_name }}"
          releaseBody: "المصحف المرتل برواية ورش — القارئ الشيخ حاج أيوب أمين"
          releaseDraft: false
          prerelease: false

      - name: Upload Windows Installers
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          if-no-files-found: warn
          path: |
            src-tauri/target/release/bundle/**/*.msi
            src-tauri/target/release/bundle/**/*.exe

      - name: Upload Windows Setup to Hugging Face
        if: success()
        shell: bash
        run: |
          EXE_FILE=$(find src-tauri/target/release/bundle -name "*.exe" | head -1)
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0-Primary"; fi
          
          if [ -n "$EXE_FILE" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
            echo "Uploading Windows EXE to Hugging Face (Quran_${VERSION}_x64-setup.exe)..."
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@$EXE_FILE" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_${VERSION}_x64-setup.exe" || true
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@$EXE_FILE" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_1.0.0_x64-setup.exe" || true
          fi

  # ───────────── 2. تطبيق أندرويد للهواتف (APK) ─────────────
  android-mobile:
    name: 📱 Build Android Mobile APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon src-tauri/icons/app-icon.png

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android Mobile APK
        run: npx tauri android build --apk --target aarch64

      - name: Prepare and sign mobile APK
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0-Primary"; fi

          if [ -n "$RAW_APK" ]; then
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
            mkdir -p dist-apk
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "dist-apk/Quran_${VERSION}_Android.apk"
            if [ "$VERSION" != "1.0.0" ]; then
              cp "dist-apk/Quran_${VERSION}_Android.apk" "dist-apk/Quran_1.0.0_Android.apk"
            fi
            
            # Sign with standard keystore
            FALLBACK_KS="${{ runner.temp }}/release.keystore"
            keytool -genkeypair -v -keystore "$FALLBACK_KS" -alias "quran" -keyalg RSA -keysize 2048 -validity 10000 -storepass "quran2026" -keypass "quran2026" -dname "CN=QuranKids"
            for apk in dist-apk/*.apk; do
              "$BUILD_TOOLS_DIR/apksigner" sign --ks "$FALLBACK_KS" --ks-pass "pass:quran2026" "$apk"
            done
          fi

      - name: Upload Mobile APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-apk
          path: dist-apk/*.apk

      - name: Attach Mobile APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-apk/*.apk --clobber || true

      - name: Upload Android Mobile APK to Hugging Face
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0-Primary"; fi

          if [ -f "dist-apk/Quran_${VERSION}_Android.apk" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
            echo "Uploading Android Mobile APK (Quran_${VERSION}_Android.apk) to Hugging Face..."
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@dist-apk/Quran_${VERSION}_Android.apk" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_${VERSION}_Android.apk" || true
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@dist-apk/Quran_1.0.0_Android.apk" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_1.0.0_Android.apk" || true
          fi

  # ───────────── 3. تطبيق التلفاز الذكي (Android TV APK) ─────────────
  android-tv:
    name: 📺 Build Android TV APK
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon src-tauri/icons/app-icon.png

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Build Android TV APK
        run: npx tauri android build --apk --target aarch64

      - name: Prepare and sign TV APK
        run: |
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0-Primary"; fi

          if [ -n "$RAW_APK" ]; then
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
            mkdir -p dist-tv
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "dist-tv/Quran_${VERSION}_Android_TV.apk"
            if [ "$VERSION" != "1.0.0" ]; then
              cp "dist-tv/Quran_${VERSION}_Android_TV.apk" "dist-tv/Quran_1.0.0_Android_TV.apk"
            fi
            
            FALLBACK_KS="${{ runner.temp }}/tv.keystore"
            keytool -genkeypair -v -keystore "$FALLBACK_KS" -alias "qurantv" -keyalg RSA -keysize 2048 -validity 10000 -storepass "quran2026" -keypass "quran2026" -dname "CN=QuranTV"
            for apk in dist-tv/*.apk; do
              "$BUILD_TOOLS_DIR/apksigner" sign --ks "$FALLBACK_KS" --ks-pass "pass:quran2026" "$apk"
            done
          fi

      - name: Upload TV APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-apk
          path: dist-tv/*.apk

      - name: Attach TV APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ github.ref_name }}" dist-tv/*.apk --clobber || true

      - name: Upload Android TV APK to Hugging Face
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0-Primary"; fi

          if [ -f "dist-tv/Quran_${VERSION}_Android_TV.apk" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
            echo "Uploading Android TV APK (Quran_${VERSION}_Android_TV.apk) to Hugging Face..."
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@dist-tv/Quran_${VERSION}_Android_TV.apk" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_${VERSION}_Android_TV.apk" || true
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@dist-tv/Quran_1.0.0_Android_TV.apk" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_1.0.0_Android_TV.apk" || true
          fi
