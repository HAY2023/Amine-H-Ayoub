name: Build 3 Core Platforms (Windows + Android Mobile + Android TV)

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ───────────── 1. تطبيق ويندوز وميكروسوفت ستور (EXE + MSI) ─────────────
  windows:
    name: 💻 Build Windows & Microsoft Store (EXE & MSI)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Clean up obsolete releases and set v1.0.0 as Latest
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for tag in "v1.0.1" "v1.0.15"; do
            gh release delete "$tag" --yes --cleanup-tag || true
          done
          gh release edit "v1.0.0" --title "Quran-Amine H Ayoub v1.0.0" --latest || true

      - name: Install dependencies
        run: npm ci

      - name: Install Tauri CLI
        run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon src-tauri/icons/app-icon.png

      - name: Build Windows desktop app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}
          releaseName: "Quran-Amine H Ayoub ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}"
          releaseBody: "Quran Kareem - Reciter Sheikh Hajj Ayoub Amine (المصحف المرتل برواية ورش — القارئ الشيخ حاج أيوب أمين)"
          releaseDraft: false
          prerelease: false

      - name: Prepare Windows & Microsoft Store Installers
        shell: bash
        run: |
          mkdir -p dist-windows
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          MSI_FILE=$(find src-tauri/target/release/bundle -name "*.msi" | head -1)
          EXE_FILE=$(find src-tauri/target/release/bundle -name "*.exe" | head -1)

          if [ -n "$MSI_FILE" ]; then
            cp "$MSI_FILE" "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Microsoft_Store.msi"
          fi
          if [ -n "$EXE_FILE" ]; then
            cp "$EXE_FILE" "dist-windows/Quran-Amine-H-Ayoub_${VERSION}_Setup.exe"
          fi

      - name: Upload Windows Installers Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-microsoft-store-installer
          if-no-files-found: warn
          path: dist-windows/*

      - name: Attach Windows Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ]; then TAG="v1.0.0"; fi
          gh release upload "$TAG" dist-windows/* --clobber || true

      - name: Upload Windows Setup to Hugging Face
        if: success()
        shell: bash
        run: |
          EXE_FILE=$(find dist-windows -name "*.exe" | head -1)
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi
          
          if [ -n "$EXE_FILE" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
            echo "Uploading Windows EXE to Hugging Face (Quran_${VERSION}_x64-setup.exe)..."
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@$EXE_FILE" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_${VERSION}_x64-setup.exe" || true
            curl -f -X POST \
              -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
              --data-binary "@$EXE_FILE" \
              "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/Quran_1.0.0_x64-setup.exe" || true
          fi

  # ───────────── 2. تطبيق أندرويد للهواتف (AAB + APK) ─────────────
  android-mobile:
    name: 📱 Build Android Mobile (AAB & APK)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Inject custom app icon into Android project
        run: |
          npx tauri icon src-tauri/icons/app-icon.png
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true

      - name: Build Android Mobile APK
        run: npx tauri android build --apk --target aarch64

      - name: Build Android Mobile AAB (Google Play Store Bundle)
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew bundleUniversalRelease || ./gradlew bundleRelease
          cd ../../..

      - name: Prepare and sign mobile AAB and APK
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
          mkdir -p dist-android-mobile

          FALLBACK_KS="${{ runner.temp }}/release.keystore"
          keytool -genkeypair -v -keystore "$FALLBACK_KS" -alias "quran" -keyalg RSA -keysize 2048 -validity 10000 -storepass "quran2026" -keypass "quran2026" -dname "CN=QuranKids"

          # Sign APK
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$RAW_APK" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "dist-android-mobile/Quran_${VERSION}_Android_Mobile.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign --ks "$FALLBACK_KS" --ks-pass "pass:quran2026" "dist-android-mobile/Quran_${VERSION}_Android_Mobile.apk"
          fi

          # Sign AAB (Google Play Bundle)
          RAW_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" -type f | head -1)
          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" "dist-android-mobile/Quran_${VERSION}_Android_Mobile.aab"
            jarsigner -keystore "$FALLBACK_KS" -storepass "quran2026" -keypass "quran2026" "dist-android-mobile/Quran_${VERSION}_Android_Mobile.aab" "quran"
          fi

      - name: Upload Mobile AAB and APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-mobile-bundle-and-apk
          path: dist-android-mobile/*

      - name: Attach Mobile Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ]; then TAG="v1.0.0"; fi
          gh release upload "$TAG" dist-android-mobile/* --clobber || true

      - name: Upload Android Mobile Artifacts to Hugging Face
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          for f in dist-android-mobile/*; do
            FNAME=$(basename "$f")
            if [ -f "$f" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
              echo "Uploading $FNAME to Hugging Face..."
              curl -f -X POST \
                -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
                --data-binary "@$f" \
                "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/$FNAME" || true
            fi
          done

  # ───────────── 3. تطبيق التلفاز الذكي (Android TV AAB + APK) ─────────────
  android-tv:
    name: 📺 Build Android TV (AAB & APK)
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      - name: Inject custom app icon into Android project
        run: |
          npx tauri icon src-tauri/icons/app-icon.png
          mkdir -p src-tauri/gen/android/app/src/main/res
          cp -rf src-tauri/icons/android/* src-tauri/gen/android/app/src/main/res/ || true

      - name: Configure Android TV Manifest (Leanback Support)
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            # Ensure touch is not required for Android TV
            sed -i '/<manifest/a \    <uses-feature android:name="android.software.leanback" android:required="false" \/>\n    <uses-feature android:name="android.hardware.touchscreen" android:required="false" \/>' "$MANIFEST"
            # Add Leanback Launcher category for Android TV launcher home screen
            sed -i '/<category android:name="android.intent.category.LAUNCHER" \/>/a \                <category android:name="android.intent.category.LEANBACK_LAUNCHER" \/>' "$MANIFEST"
          fi

      - name: Build Android TV APK
        run: npx tauri android build --apk --target aarch64

      - name: Build Android TV AAB (Google Play TV Bundle)
        run: |
          cd src-tauri/gen/android
          chmod +x gradlew
          ./gradlew bundleUniversalRelease || ./gradlew bundleRelease
          cd ../../..

      - name: Prepare and sign TV AAB and APK
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
          mkdir -p dist-android-tv

          FALLBACK_KS="${{ runner.temp }}/tv.keystore"
          keytool -genkeypair -v -keystore "$FALLBACK_KS" -alias "qurantv" -keyalg RSA -keysize 2048 -validity 10000 -storepass "quran2026" -keypass "quran2026" -dname "CN=QuranTV"

          # Sign TV APK
          RAW_APK=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -n "$RAW_APK" ]; then
            "$BUILD_TOOLS_DIR/zipalign" -f -p 4 "$RAW_APK" "dist-android-tv/Quran_${VERSION}_Android_TV.apk"
            "$BUILD_TOOLS_DIR/apksigner" sign --ks "$FALLBACK_KS" --ks-pass "pass:quran2026" "dist-android-tv/Quran_${VERSION}_Android_TV.apk"
          fi

          # Sign TV AAB (Google Play TV Bundle)
          RAW_AAB=$(find src-tauri/gen/android/app/build/outputs/bundle -name "*.aab" -type f | head -1)
          if [ -n "$RAW_AAB" ]; then
            cp "$RAW_AAB" "dist-android-tv/Quran_${VERSION}_Android_TV.aab"
            jarsigner -keystore "$FALLBACK_KS" -storepass "quran2026" -keypass "quran2026" "dist-android-tv/Quran_${VERSION}_Android_TV.aab" "qurantv"
          fi

      - name: Upload TV AAB and APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-tv-bundle-and-apk
          path: dist-android-tv/*

      - name: Attach TV Packages to GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"
          if [ "$TAG" = "main" ]; then TAG="v1.0.0"; fi
          gh release upload "$TAG" dist-android-tv/* --clobber || true

      - name: Upload Android TV Artifacts to Hugging Face
        if: success()
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          if [ -z "$VERSION" ] || [ "$VERSION" = "main" ]; then VERSION="1.0.0"; fi

          for f in dist-android-tv/*; do
            FNAME=$(basename "$f")
            if [ -f "$f" ] && [ -n "${{ secrets.HF_TOKEN }}" ]; then
              echo "Uploading $FNAME to Hugging Face..."
              curl -f -X POST \
                -H "Authorization: Bearer ${{ secrets.HF_TOKEN }}" \
                --data-binary "@$f" \
                "https://huggingface.co/api/datasets/hammoualiyoucef20/quran-app-releases/upload/main/$FNAME" || true
            fi
          done
