name: Publish Distribution Releases

# يعمل فقط عند دفع وسم إصدار (مثل v1.0.0) أو تشغيل يدوي
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ═══════════════════════════════════════════════════════════════════
# هذا المسار يتكون من مرحلتين:
#   مرحلة 1 — البناء: 4 وظائف مستقلة تعمل بالتوازي الكامل
#   مرحلة 2 — النشر: 4 وظائف تسلسلية تُحدّث releases.json واحدة تلو الأخرى
#
# كل وظيفة بناء مستقلة تماماً: نجاح ويندوز لا يعتمد على نجاح ماك أو لينكس
# كل وظيفة نشر تعتمد فقط على وظيفة بنائها الخاصة
# ═══════════════════════════════════════════════════════════════════

jobs:
  # ╔═══════════════════════════════════════════╗
  # ║     مرحلة 1: البناء بالتوازي الكامل       ║
  # ╚═══════════════════════════════════════════╝

  # ───────────── ويندوز ─────────────
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      # توليد الأيقونة (نفس الخطوة المُصلحة سابقاً — ملف PNG صالح ومُختبر)
      - name: Generate app icon
        run: npx --yes @tauri-apps/cli@^2 icon public/pwa-512x512.png

      - name: Build Windows desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "قرآن أطفال ${{ github.ref_name }}"
          releaseBody: "نسخ التطبيق: حمّل الملف المناسب لجهازك."
          releaseDraft: true
          prerelease: false

  # ───────────── ماك ─────────────
  build-macos:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Generate app icon
        run: npx --yes @tauri-apps/cli@^2 icon public/pwa-512x512.png

      - name: Build macOS desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "قرآن أطفال ${{ github.ref_name }}"
          releaseDraft: true

  # ───────────── لينكس ─────────────
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci

      - name: Generate app icon
        run: npx --yes @tauri-apps/cli@^2 icon public/pwa-512x512.png

      - name: Build Linux desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "قرآن أطفال ${{ github.ref_name }}"
          releaseDraft: true

  # ───────────── أندرويد (بناء إنتاج موقّع) ─────────────
  # ⚠️ ملاحظة: نستهدف aarch64 فقط لتفادي خطأ "No space left on device"
  #    الذي يحدث عند بناء 4 معماريات على GitHub Runner (14GB فقط).
  #    معمارية aarch64 تغطي ~95% من أجهزة Android الحديثة.
  #    لإضافة armv7 لاحقاً، يمكن فصله إلى job مستقل أو استخدام runner أكبر.
  build-android:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # تحرير مساحة القرص قبل البناء
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/platforms /usr/local/lib/android/sdk/build-tools/3[0-2]* /opt/ghc
          sudo apt-get clean
          df -h

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;26.1.10909125"
          echo "NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/26.1.10909125" >> $GITHUB_ENV

      # فقط aarch64 — لتوفير المساحة وتغطية الغالبية العظمى من الأجهزة
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon public/pwa-512x512.png

      - name: Build frontend
        run: npm run build

      - name: Initialize Android project
        run: npx tauri android init || true

      # بناء نسخة Release لمعمارية aarch64 (APK و AAB)
      - name: Build release APK & AAB (aarch64)
        run: |
          npx tauri android build --apk --target aarch64
          npx tauri android build --aab --target aarch64 || true

      # توقيع APK بمفتاح الإنتاج الثابت إن وجد
      - name: Sign APK with production keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          # البحث عن APK الناتج
          APK_PATH=$(find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" -type f | head -1)
          echo "Found APK at: $APK_PATH"

          if [ -n "$APK_PATH" ]; then
            # تحديد أدوات البناء
            BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -1)"
            echo "Using build-tools: $BUILD_TOOLS_DIR"

            # محاذاة
            cp "$APK_PATH" "$APK_PATH.original"
            "$BUILD_TOOLS_DIR/zipalign" -f 4 "$APK_PATH.original" "$APK_PATH" || true

            # محاولة التوقيع إن وُجدت المفاتيح
            if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASS" ]; then
              # التحقق من خلو كلمات المرور من أحرف غير ASCII (مثل الحروف العربية أو الاقتباسات الذكية)
              if LC_ALL=C grep -q '[^ -~]' <<< "$KEYSTORE_PASS"; then
                echo "::error::KEYSTORE_PASSWORD contains non-ASCII characters. apksigner requires ASCII-only passwords."
                exit 1
              fi
              if LC_ALL=C grep -q '[^ -~]' <<< "$KEY_PASS"; then
                echo "::error::KEY_PASSWORD contains non-ASCII characters. apksigner requires ASCII-only passwords."
                exit 1
              fi

              echo "$KEYSTORE_B64" | base64 --decode > "${{ runner.temp }}/release.keystore"
              "$BUILD_TOOLS_DIR/apksigner" sign \
                --ks "${{ runner.temp }}/release.keystore" \
                --ks-pass "env:KEYSTORE_PASS" \
                --ks-key-alias "$KEY_ALIAS" \
                --key-pass "env:KEY_PASS" \
                "$APK_PATH" || { echo "::error::Keystore signing failed"; exit 1; }
            fi
          fi

      # رفع APK و AAB إلى GitHub Release
      - name: Attach signed APK and AAB to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab

  # ───────────── iOS (حزمة IPA لأجهزة iPhone / iPad) ─────────────
  build-ios:
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, x86_64-apple-ios

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: npm ci
      - run: npm install -D @tauri-apps/cli@^2

      - name: Generate app icon
        run: npx tauri icon public/pwa-512x512.png

      - name: Build frontend
        run: npm run build

      - name: Initialize and build iOS
        run: |
          npx tauri ios init || true
          npx tauri ios build --export-method development || true

      - name: Attach iOS packages to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app

  # ╔═══════════════════════════════════════════════════════════════╗
  # ║  مرحلة 2: تحديث releases.json (تسلسلي عبر concurrency)     ║
  # ╠═══════════════════════════════════════════════════════════════╣
  # ║  ⚠️ ملاحظة مهمة:                                            ║
  # ║  مجموعة التزامن releases-json-write تضمن أن وظيفة واحدة    ║
  # ║  فقط تكتب على releases.json في أي لحظة.                     ║
  # ║  إذا انتهت أكثر من منصة بناءً في نفس الوقت تقريباً،        ║
  # ║  فإن الوظائف الأخرى تنتظر دورها — هذا سلوك متعمد ومقصود   ║
  # ║  وليس تعليقاً (hang). قد يستمر الانتظار عدة دقائق.         ║
  # ╚═══════════════════════════════════════════════════════════════╝

  # ───────────── نشر ويندوز ─────────────
  publish-windows:
    needs: build-windows
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    # ⚠️ انتظار تسلسلي متعمد — يمنع تعارض كتابتين متزامنتين على releases.json
    concurrency:
      group: releases-json-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update releases.json for Windows
        run: |
          node -e "
            const fs = require('fs');
            const path = 'releases-site/releases.json';
            
            let data = { platforms: { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } } };
            try { 
              if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8')); 
            } catch (e) {
              console.log('Initializing fresh releases.json');
            }
            if (!data.platforms) data.platforms = { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } };
            if (!data.platforms.windows) data.platforms.windows = { releases: [] };

            const tag = '${{ github.ref_name }}';
            const ver = tag.replace(/^v/, '');
            const repo = '${{ github.repository }}';
            const date = new Date().toISOString().split('T')[0];

            const exists = data.platforms.windows.releases.some(r => r.version === tag);
            if (!exists) {
              data.platforms.windows.releases.unshift({
                version: tag,
                date: date,
                url: 'https://github.com/' + repo + '/releases/download/' + tag + '/hajj-ayoub-amine_' + ver + '_x64-setup.exe',
                size: '',
                changelog: ['إصدار جديد'],
                active: false
              });
            }

            fs.mkdirSync('releases-site', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
            console.log('✅ Windows release ' + tag + ' added to releases.json');
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases-site/releases.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(windows): add release ${{ github.ref_name }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages

  # ───────────── نشر ماك ─────────────
  publish-macos:
    needs: build-macos
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: releases-json-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update releases.json for macOS
        run: |
          node -e "
            const fs = require('fs');
            const path = 'releases-site/releases.json';
            let data = { platforms: { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } } };
            try { 
              if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8')); 
            } catch (e) {
              console.log('Initializing fresh releases.json');
            }
            if (!data.platforms) data.platforms = { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } };
            if (!data.platforms.macos) data.platforms.macos = { releases: [] };

            const tag = '${{ github.ref_name }}';
            const ver = tag.replace(/^v/, '');
            const repo = '${{ github.repository }}';
            const date = new Date().toISOString().split('T')[0];

            const exists = data.platforms.macos.releases.some(r => r.version === tag);
            if (!exists) {
              data.platforms.macos.releases.unshift({
                version: tag,
                date: date,
                url: 'https://github.com/' + repo + '/releases/download/' + tag + '/hajj-ayoub-amine_' + ver + '_aarch64.dmg',
                size: '',
                changelog: ['إصدار جديد'],
                active: false
              });
            }

            fs.mkdirSync('releases-site', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
            console.log('✅ macOS release ' + tag + ' added');
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases-site/releases.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(macos): add release ${{ github.ref_name }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages

  # ───────────── نشر لينكس ─────────────
  publish-linux:
    needs: build-linux
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: releases-json-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update releases.json for Linux
        run: |
          node -e "
            const fs = require('fs');
            const path = 'releases-site/releases.json';
            let data = { platforms: { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } } };
            try { 
              if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8')); 
            } catch (e) {
              console.log('Initializing fresh releases.json');
            }
            if (!data.platforms) data.platforms = { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } };
            if (!data.platforms.linux) data.platforms.linux = { releases: [] };

            const tag = '${{ github.ref_name }}';
            const ver = tag.replace(/^v/, '');
            const repo = '${{ github.repository }}';
            const date = new Date().toISOString().split('T')[0];

            const exists = data.platforms.linux.releases.some(r => r.version === tag);
            if (!exists) {
              data.platforms.linux.releases.unshift({
                version: tag,
                date: date,
                url: 'https://github.com/' + repo + '/releases/download/' + tag + '/hajj-ayoub-amine_' + ver + '_amd64.AppImage',
                size: '',
                changelog: ['إصدار جديد'],
                active: false
              });
            }

            fs.mkdirSync('releases-site', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
            console.log('✅ Linux release ' + tag + ' added');
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases-site/releases.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(linux): add release ${{ github.ref_name }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages

  # ───────────── نشر أندرويد ─────────────
  publish-android:
    needs: build-android
    if: success()
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    concurrency:
      group: releases-json-write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Update releases.json for Android
        run: |
          node -e "
            const fs = require('fs');
            const path = 'releases-site/releases.json';
            let data = { platforms: { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } } };
            try { 
              if (fs.existsSync(path)) data = JSON.parse(fs.readFileSync(path, 'utf8')); 
            } catch (e) {
              console.log('Initializing fresh releases.json');
            }
            if (!data.platforms) data.platforms = { windows: { releases: [] }, macos: { releases: [] }, linux: { releases: [] }, android: { releases: [] } };
            if (!data.platforms.android) data.platforms.android = { releases: [] };

            const tag = '${{ github.ref_name }}';
            const repo = '${{ github.repository }}';
            const date = new Date().toISOString().split('T')[0];

            const exists = data.platforms.android.releases.some(r => r.version === tag);
            if (!exists) {
              data.platforms.android.releases.unshift({
                version: tag,
                date: date,
                url: 'https://github.com/' + repo + '/releases/download/' + tag + '/app-universal-release.apk',
                size: '',
                changelog: ['إصدار جديد'],
                active: false
              });
            }

            fs.mkdirSync('releases-site', { recursive: true });
            fs.writeFileSync(path, JSON.stringify(data, null, 2));
            console.log('✅ Android release ' + tag + ' added');
          "

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add releases-site/releases.json
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "chore(android): add release ${{ github.ref_name }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages
