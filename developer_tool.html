<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>أداة المطور - قرآن كيدز</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; background: #f8fafc; color: #334155; }
    .card { background: white; padding: 24px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
    h1 { margin-top: 0; color: #0f172a; font-size: 1.5rem; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 8px; font-weight: 500; }
    input { width: 100%; padding: 8px 12px; border: 1px solid #cbd5e1; border-radius: 6px; box-sizing: border-box; }
    button { background: #3b82f6; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: 600; cursor: pointer; width: 100%; margin-top: 8px; }
    button:hover { background: #2563eb; }
    .result { margin-top: 24px; }
    textarea { width: 100%; height: 100px; padding: 12px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f1f5f9; box-sizing: border-box; direction: ltr; font-family: monospace; resize: none; }
    .help-text { font-size: 0.875rem; color: #64748b; margin-top: 4px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>أداة إدارة الحساب (المطور)</h1>
    <p class="help-text">أدخل البيانات المطلوبة لتوليد كود يمكن لصقه داخل التطبيق لتحديث حساب الطفل.</p>
    
    <div class="form-group">
      <label for="coins">تحديث عدد النجوم (اتركه فارغاً للتجاهل)</label>
      <input type="number" id="coins" placeholder="مثال: 500000">
    </div>
    
    <div class="form-group">
      <label for="items">إضافة عناصر للمتجر (مفصولة بفاصلة ,)</label>
      <input type="text" id="items" placeholder="مثال: av-img-boy-sultan-navy, col-gold">
      <p class="help-text">اكتب معرّفات العناصر لإضافتها لمخزون الطفل المفتوح.</p>
    </div>

    <button onclick="generateCode()">توليد الكود</button>

    <div class="result" id="result-container" style="display: none;">
      <label>كود التكوين (انسخ هذا الكود والصقه في إعدادات التطبيق):</label>
      <textarea id="output" readonly></textarea>
      <button onclick="copyCode()" style="background: #10b981;">نسخ الكود</button>
    </div>
  </div>

  <script>
    function generateCode() {
      const coinsRaw = document.getElementById('coins').value;
      const itemsRaw = document.getElementById('items').value;
      
      const payload = { type: 'DEV_TOOL_UPDATE' };
      if (coinsRaw !== '') {
        payload.coins = parseInt(coinsRaw, 10);
      }
      if (itemsRaw.trim() !== '') {
        payload.items = itemsRaw.split(',').map(s => s.trim()).filter(Boolean);
      }
      
      const jsonStr = JSON.stringify(payload);
      // Simple base64 encoding to obfuscate slightly
      const encoded = btoa(unescape(encodeURIComponent(jsonStr)));
      
      const output = document.getElementById('output');
      output.value = encoded;
      document.getElementById('result-container').style.display = 'block';
    }

    function copyCode() {
      const output = document.getElementById('output');
      output.select();
      document.execCommand('copy');
      alert('تم نسخ الكود بنجاح!');
    }
  </script>
</body>
</html>
