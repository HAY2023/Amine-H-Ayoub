# إعداد Fly.io — يبني من Dockerfile، يتوقّف عند الخمول (لتقليل التكلفة للحد الأدنى)
app = "quran-audio-segmentation"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"     # أوقف الآلة عند الخمول (مجاني فعلياً)
  auto_start_machines = true      # أعد تشغيلها عند أول طلب
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "20s"
    method = "GET"
    path = "/health"

# librosa يحتاج ذاكرة كافية للسور القصيرة
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
